server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location ~* \.(mjs|js|css|json)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
